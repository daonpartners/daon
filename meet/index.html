<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정육마트 장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#FFFFFF; --page:#F3F5F7; --ink:#1C2127; --sub:#4A545E; --line:#C8CFD6;
  --head:#E7EBEF; --zebra:#F8FAFB; --bar:#7A1F24; --bar-ink:#FFFFFF;
  --excel:#1E7145; --excel-bg:#E6F2EA; --buy:#1F4E8C; --buy-bg:#E8EFF8;
  --warn:#B42318; --warn-bg:#FDECEA; --ok:#1E7145; --ok-bg:#E6F2EA; --sel:#FFF6D6;
  --fs:18px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1F24; --page:#121519; --ink:#ECEFF2; --sub:#AAB4BE; --line:#3A424B;
    --head:#262C33; --zebra:#1F242A; --bar:#5E181C; --excel:#5CC08A; --excel-bg:#173024;
    --buy:#8DB4EA; --buy-bg:#1A2636; --warn:#FF8A80; --warn-bg:#3A1C1C; --ok:#5CC08A; --ok-bg:#173024; --sel:#3A3420;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1F24; --page:#121519; --ink:#ECEFF2; --sub:#AAB4BE; --line:#3A424B;
  --head:#262C33; --zebra:#1F242A; --bar:#5E181C; --excel:#5CC08A; --excel-bg:#173024;
  --buy:#8DB4EA; --buy-bg:#1A2636; --warn:#FF8A80; --warn-bg:#3A1C1C; --ok:#5CC08A; --ok-bg:#173024; --sel:#3A3420;
}
:root.big{--fs:21px}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:var(--fs);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--excel);outline-offset:2px}

/* 상단바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);
  display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.top h1{margin:0;font-size:1.25em;font-weight:700;letter-spacing:-.01em}
.top .date{opacity:.9}
.top .sp{flex:1}
.top button{background:transparent;border:2px solid rgba(255,255,255,.7);color:#fff;border-radius:8px;padding:4px 12px;min-height:44px}
.top .store{font-size:.8em;opacity:.85}

.wrap{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto}
nav{position:sticky;top:76px;width:196px;flex:none;padding:14px 10px;display:flex;flex-direction:column;gap:6px}
nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;
  padding:12px 14px;border-radius:10px;min-height:52px;font-weight:500}
nav button .ic{font-size:1.2em;width:1.4em;text-align:center}
nav button:hover{background:var(--head)}
nav button[aria-current="page"]{background:var(--paper);box-shadow:inset 5px 0 0 var(--bar);font-weight:700}
main{flex:1;min-width:0;padding:18px 18px 60px}

h2{font-size:1.45em;margin:4px 0 4px}
.lead{color:var(--sub);margin:0 0 16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.panel h3{margin:0 0 12px;font-size:1.1em}

/* 입력 폼 */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px}
.f.wide{grid-column:span 2}
.f span{font-weight:500;color:var(--sub);font-size:.9em}
.f input,.f select,.f textarea{border:2px solid var(--line);border-radius:8px;padding:9px 10px;min-height:50px;background:var(--paper);width:100%}
.f input:focus,.f select:focus{border-color:var(--excel);outline:none}
.f input.num{text-align:right;font-variant-numeric:tabular-nums}
.f small{color:var(--sub);font-size:.8em}
.toggle{display:flex;gap:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;min-height:50px}
.toggle button{flex:1;border:0;background:var(--paper);font-weight:500}
.toggle button[aria-pressed="true"]{background:var(--excel);color:#fff}
.toggle button.bad[aria-pressed="true"]{background:var(--warn);color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 20px;min-height:52px;font-weight:700}
.btn.main{background:var(--bar);border-color:var(--bar);color:#fff}
.btn.xl{background:var(--excel);border-color:var(--excel);color:#fff}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.danger.solid{background:var(--warn);color:#fff}
.btn.sm{min-height:44px;padding:6px 14px;font-weight:500}
.msg{padding:10px 14px;border-radius:8px;font-weight:500}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.bad{background:var(--warn-bg);color:var(--warn)}
.msg:empty{display:none}
.note{background:var(--head);border-radius:8px;padding:10px 14px;color:var(--sub);font-size:.88em;margin-top:12px}

/* 기간 선택 */
.range{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.range button{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 14px;min-height:46px}
.range button[aria-pressed="true"]{border-color:var(--excel);background:var(--excel-bg);font-weight:700}
.range input{border:2px solid var(--line);border-radius:8px;padding:6px 8px;min-height:46px;background:var(--paper)}
.range .srch{min-width:180px}

/* 엑셀형 표 */
.sheetbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.sheetbar .cnt{color:var(--sub)}
.sheetbar .sp{flex:1}
.sheetwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
table.sheet{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;font-size:.95em}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 10px;white-space:nowrap}
.sheet thead th{position:sticky;top:0;background:var(--head);font-weight:700;text-align:center;z-index:2;cursor:pointer;user-select:none}
.sheet thead th.rn,.sheet td.rn{background:var(--head);color:var(--sub);text-align:center;width:3.2em;font-weight:500;cursor:default}
.sheet tbody tr:nth-child(even) td:not(.rn){background:var(--zebra)}
.sheet tbody tr{cursor:pointer}
.sheet tbody tr:hover td:not(.rn){background:var(--sel)}
.sheet tbody tr.on td{background:var(--sel)!important;box-shadow:inset 0 2px 0 var(--excel),inset 0 -2px 0 var(--excel)}
.sheet td.n{text-align:right}
.sheet td.c{text-align:center}
.sheet td.neg{color:var(--warn)}
.sheet td.flag{color:var(--warn);font-weight:700}
.sheet tfoot td{position:sticky;bottom:0;background:var(--excel-bg);font-weight:700;border-top:2px solid var(--excel);z-index:1}
.sheet .empty{padding:30px;text-align:center;color:var(--sub);cursor:default}
.sorted::after{content:" ▲";font-size:.7em}
.sorted.desc::after{content:" ▼"}

/* 홈 */
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.stat .l{color:var(--sub);font-weight:500}
.stat .v{font-size:1.9em;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .s{color:var(--sub);font-size:.85em}
.stat.hero{border-left:8px solid var(--bar)}
.stat.buy{border-left:8px solid var(--buy)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;background:var(--head)}
.todo li.bad{background:var(--warn-bg);color:var(--warn);font-weight:500}
.todo li.ok{background:var(--ok-bg);color:var(--ok)}
.todo li .sp{flex:1}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.85em;font-weight:500}
.tag.free{background:var(--ok-bg);color:var(--ok)}
.tag.tax{background:var(--buy-bg);color:var(--buy)}

/* 급여명세서 인쇄 */
#slip{display:none}
@media print{
  body{background:#fff;color:#000}
  .top,nav,.noprint{display:none!important}
  main{padding:0}
  body.printslip main>*{display:none}
  body.printslip #slip{display:block}
  .sheetwrap{max-height:none;overflow:visible;border:0}
  .sheet thead th,.sheet tfoot td{position:static}
}
.slip table{border-collapse:collapse;width:100%;margin:10px 0}
.slip td,.slip th{border:1px solid #666;padding:6px 10px}
.slip td.n{text-align:right}

@media (max-width:900px){
  .wrap{flex-direction:column}
  nav{position:sticky;top:0;width:100%;flex-direction:row;overflow-x:auto;padding:8px;background:var(--page);z-index:10;border-bottom:1px solid var(--line)}
  nav button{flex:none;min-height:48px;padding:8px 12px}
  nav button[aria-current="page"]{box-shadow:inset 0 -4px 0 var(--bar)}
  main{padding:12px 10px 60px}
  .cols2{grid-template-columns:1fr}
  .f.wide{grid-column:span 1}
  .top{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1 id="shopName">정육마트 장부</h1>
  <span class="date" id="todayLabel"></span>
  <span class="sp"></span>
  <span class="store" id="storeMode">이 기기에 저장</span>
  <button id="fontBtn" aria-label="글자 크기 바꾸기">글자 크게</button>
</header>
<div class="wrap">
  <nav id="nav" aria-label="메뉴"></nav>
  <main id="main"></main>
</div>
<div id="slip" class="slip"></div>

<script>
/* ============ 기본 도구 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0};
const won=n=>Math.round(n||0).toLocaleString('ko-KR');
const kgf=n=>(+n||0).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:3});
const pct=n=>isFinite(n)?(n*100).toFixed(1)+'%':'-';
const f10=n=>Math.floor((n||0)/10)*10; /* 10원 미만 절사 */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const ym=s=>String(s||'').slice(0,7);
const WEEK=['일','월','화','수','목','금','토'];

/* ============ 저장소 (claude.ai 공용저장소 → 없으면 이 기기) ============ */
const COLS=['items','partners','purchases','sales','haccp','staff','payroll','invoices','settings'];
const S={};COLS.forEach(c=>S[c]=[]);
let db=null, mode='local';
const LSKEY='meatshop_v2';
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LSKEY)||'{}');COLS.forEach(c=>{if(Array.isArray(o[c]))S[c]=o[c]})}catch(e){}}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
function clean(o){return JSON.parse(JSON.stringify(o))}
async function put(c,row){
  row.id=row.id||uid(); row.updatedAt=Date.now();
  const i=S[c].findIndex(r=>r.id===row.id); if(i>=0)S[c][i]=row; else S[c].push(row);
  saveLocal(); refresh(); if(mode==='sync')queue(c,row.id,false);
  if(mode==='cloud'){ try{await db.collection(c).doc(row.id).set(clean(row))}catch(e){ flash('저장소에 올리지 못했습니다. 인터넷 연결을 확인하고 다시 저장해 주세요.',true); throw e } }
  return row;
}
async function del(c,id){
  S[c]=S[c].filter(r=>r.id!==id); saveLocal(); refresh(); if(mode==='sync')queue(c,id,true);
  if(mode==='cloud'){ try{await db.collection(c).doc(id).delete()}catch(e){flash('삭제가 저장소에 반영되지 않았습니다. 다시 시도해 주세요.',true)} }
}
async function cloudRun(tasks){ /* 동시 3개, 실패 시 대기 후 재시도 */
  let i=0,fail=0;const worker=async()=>{while(i<tasks.length){const t=tasks[i++];for(let a=1;a<=4;a++){try{await t();break}catch(e){if(a===4){fail++;break}await new Promise(r=>setTimeout(r,900*a))}}}};
  await Promise.all([worker(),worker(),worker()]);return fail}
async function bulkPut(c,rows){rows.forEach(r=>{r.id=r.id||uid();r.updatedAt=Date.now();const i=S[c].findIndex(x=>x.id===r.id);if(i>=0)S[c][i]=r;else S[c].push(r)});
  saveLocal();refresh();if(mode==='sync'){rows.forEach(r=>queue(c,r.id,false,true));schedulePush(300);return 0}if(mode==='cloud')return cloudRun(rows.map(r=>()=>db.collection(c).doc(r.id).set(clean(r))));return 0}
async function bulkDel(c,ids){S[c]=S[c].filter(r=>!ids.includes(r.id));saveLocal();refresh();if(mode==='sync'){ids.forEach(id=>queue(c,id,true,true));schedulePush(300);return 0}if(mode==='cloud')return cloudRun(ids.map(id=>()=>db.collection(c).doc(id).delete()));return 0}
/* ---- 휴대폰·매장PC 동기화 (n8n) ---- */
const API='https://daonpartners.app.n8n.cloud/webhook/';
let sync=null, outbox={}, until=0, pushing=false, pulling=false, pushT=null, lastOk=0, authBad=false, offline=false;
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function queue(c,id,deleted,quiet){outbox[c+'|'+id]={coll:c,rid:id,deleted:!!deleted,v:Date.now()+Math.random()};lsSet('meatshop_outbox',outbox);showSync();if(!quiet)schedulePush(1200)}
function schedulePush(ms){clearTimeout(pushT);pushT=setTimeout(pushNow,ms||1200)}
async function api(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({shop:sync.shop,pin:sync.pin},body))});
  const j=await r.json().catch(()=>({}));if(r.status===401||j.ok===false){authBad=true;const e=new Error('auth');e.auth=true;throw e}if(!r.ok)throw new Error('http '+r.status);authBad=false;return j}
async function pushNow(){if(mode!=='sync'||pushing||authBad)return;const keys=Object.keys(outbox).slice(0,300);if(!keys.length)return;pushing=true;showSync();
  try{const snap=keys.map(k=>Object.assign({k},outbox[k]));
    const rows=snap.map(o=>{const r=S[o.coll].find(x=>x.id===o.rid);return r&&!o.deleted?{coll:o.coll,rid:o.rid,data:JSON.stringify(r),deleted:false}:{coll:o.coll,rid:o.rid,data:'',deleted:true}});
    await api('meatshop-push',{rows});snap.forEach(o=>{if(outbox[o.k]&&outbox[o.k].v===o.v)delete outbox[o.k]});lsSet('meatshop_outbox',outbox);lastOk=Date.now();offline=false}
  catch(e){if(!e.auth)offline=true}finally{pushing=false;showSync()}
  if(!offline&&!authBad){if(Object.keys(outbox).length)schedulePush(200);else pullNow()}else if(!authBad)schedulePush(15000)}
async function pullNow(){if(mode!=='sync'||pulling||authBad)return;pulling=true;
  try{const j=await api('meatshop-pull',{since:until});let n=0;
    (j.rows||[]).forEach(r=>{if(!S[r.coll]||outbox[r.coll+'|'+r.rid])return;n++;const i=S[r.coll].findIndex(x=>x.id===r.rid);
      if(r.deleted){if(i>=0)S[r.coll].splice(i,1)}else{let o;try{o=JSON.parse(r.data)}catch(e){return}o.id=r.rid;if(i>=0)S[r.coll][i]=o;else S[r.coll].push(o)}});
    if(j.until>until){until=j.until;lsSet('meatshop_until',until)}if(n){saveLocal();scheduleRefresh()}lastOk=Date.now();offline=false}
  catch(e){if(!e.auth)offline=true}finally{pulling=false;showSync()}}
function showSync(){const el=$('#storeMode');if(!el)return;const n=Object.keys(outbox).length;
  if(mode!=='sync'){el.textContent=mode==='cloud'?'공용 저장소에 저장':'이 기기에만 저장 (연결 안 됨)';return}
  el.textContent=authBad?'⚠ 매장코드·비밀번호 확인 필요':offline?`⚠ 인터넷 끊김 · ${n}건 이 기기에 보관 중`:(pushing||n)?`저장 중… ${n}건`:'✓ 휴대폰·PC 연결됨'}
async function connectSync(shop,pin){const prev={sync,mode};sync={shop:shop.trim(),pin:pin.trim()};authBad=false;
  try{const j=await api('meatshop-pull',{since:0});
    const had=COLS.some(c=>S[c].length);const server=(j.rows||[]).filter(r=>!r.deleted);
    lsSet('meatshop_sync',sync);mode='sync';outbox={};until=0;
    if(!server.length&&had){COLS.forEach(c=>S[c].forEach(r=>queue(c,r.id,false,true)))}else{COLS.forEach(c=>S[c]=[]);saveLocal()}
    await pullNow();schedulePush(100);startTimers();refresh();return j.shopName||'매장'}
  catch(e){sync=prev.sync;mode=prev.mode;throw e}}
let timers=false;
function startTimers(){if(timers)return;timers=true;setInterval(()=>{if(!document.hidden){pullNow();if(Object.keys(outbox).length)pushNow()}},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullNow()});window.addEventListener('online',()=>{offline=false;pushNow();pullNow()})}
async function initStore(){
  loadLocal(); sync=lsGet('meatshop_sync',null); outbox=lsGet('meatshop_outbox',{}); until=lsGet('meatshop_until',0);
  const q=new URLSearchParams(location.search);
  if(q.get('shop')&&q.get('pin')){try{history.replaceState(null,'',location.pathname)}catch(e){}
    boot();try{const nm=await connectSync(q.get('shop'),q.get('pin'));alertBanner(nm+' 장부와 연결되었습니다. 이 기기는 다음부터 자동으로 연결됩니다.')}catch(e){alertBanner('연결하지 못했습니다. 매장코드·비밀번호 또는 인터넷을 확인해 주세요.',true)}return}
  if(sync){mode='sync';boot();showSync();pullNow();pushNow();startTimers();return}
  boot();
  try{ if(window.claude&&typeof window.claude.use==='function'){ db=await window.claude.use('db'); } }catch(e){ db=null }
  if(!db){showSync();return}
  mode='cloud'; showSync();
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
      saveLocal(); scheduleRefresh();
    },()=>{ $('#storeMode').textContent='저장소 연결 끊김 — 이 기기에만 저장 중'; mode='local' });
  });
}
function alertBanner(t,bad){const d=document.createElement('div');d.className='msg '+(bad?'bad':'ok');d.style.cssText='margin:10px 18px';d.textContent=t;
  document.body.insertBefore(d,document.querySelector('.wrap'));setTimeout(()=>d.remove(),10000)}
let rt=null; function scheduleRefresh(){clearTimeout(rt);rt=setTimeout(refresh,60)}

/* ============ 설정 ============ */
const DEF_SET={id:'main',shop:'정육마트',bizNo:'',owner:'',
  fridgeMin:-2,fridgeMax:10,freezerMax:-18,
  np:4.75,hi:3.595,ltcRatio:0.9448/7.19*100,ei:0.9,npCap:6590000,mealFree:200000};
function SET(){return Object.assign({},DEF_SET,S.settings.find(s=>s.id==='main')||{})}

/* ============ 계산 로직 ============ */
function item(id){return S.items.find(i=>i.id===id)||{}}
function partner(id){return S.partners.find(p=>p.id===id)||{}}
function unitCostKg(sale){
  /* 1순위: 같은 이력번호의 매입단가 / 2순위: 같은 품목의 가장 최근 매입단가. 수율로 나눠 정육 1kg 원가로 환산 */
  const it=item(sale.itemId); const y=(num(it.yieldPct)||100)/100;
  let p=null;
  if(sale.trace){ p=S.purchases.filter(x=>x.trace===sale.trace).sort((a,b)=>b.date.localeCompare(a.date))[0] }
  if(!p){ p=S.purchases.filter(x=>x.itemId===sale.itemId&&x.date<=sale.date).sort((a,b)=>b.date.localeCompare(a.date))[0] }
  if(!p||!num(p.weight)) return null;
  return (num(p.amount)/num(p.weight))/y;
}
function saleRow(s){
  const it=item(s.itemId); const uc=unitCostKg(s);
  const cost=uc==null?null:uc*num(s.weight);
  const margin=cost==null?null:num(s.amount)-cost;
  return Object.assign({},s,{itemName:it.name||'(삭제된 품목)',taxType:it.taxType||'면세',
    partnerName:s.kind==='납품'?(partner(s.partnerId).name||''):'일반 손님',
    cost,margin,rate:cost==null||!num(s.amount)?NaN:margin/num(s.amount)});
}
function purRow(p){const it=item(p.itemId);return Object.assign({},p,{itemName:it.name||'(삭제된 품목)',partnerName:partner(p.partnerId).name||'',taxType:it.taxType||'면세',unit:num(p.weight)?num(p.amount)/num(p.weight):0})}
function inRange(d,r){return (!r.from||d>=r.from)&&(!r.to||d<=r.to)}
function traceBook(){
  const m={};
  S.purchases.forEach(p=>{ if(!p.trace)return; const t=m[p.trace]||(m[p.trace]={trace:p.trace,itemId:p.itemId,grade:p.grade||'',partnerId:p.partnerId,firstBuy:p.date,lastBuy:p.date,buyKg:0,saleKg:0,lastSale:''});
    t.buyKg+=num(p.weight); if(p.date<t.firstBuy)t.firstBuy=p.date; if(p.date>t.lastBuy)t.lastBuy=p.date; });
  S.sales.forEach(s=>{ if(!s.trace)return; const t=m[s.trace]||(m[s.trace]={trace:s.trace,itemId:s.itemId,grade:'',partnerId:'',firstBuy:'',lastBuy:'',buyKg:0,saleKg:0,lastSale:'',noBuy:true});
    t.saleKg+=num(s.weight); if(s.date>t.lastSale)t.lastSale=s.date; });
  return Object.values(m).map(t=>{const it=item(t.itemId);const y=(num(it.yieldPct)||100)/100;
    const left=t.buyKg-t.saleKg/y;
    return Object.assign(t,{itemName:it.name||'',partnerName:partner(t.partnerId).name||'',left,
      keepBuy:t.lastBuy?addDays(t.lastBuy,365):'',keepSale:t.lastSale?addDays(t.lastSale,730):'',
      status:t.noBuy?'매입기록 없음':(left<=0.05?'판매 완료':'판매 중')})});
}
function traceCheck(v){v=String(v||'').trim(); if(!v)return ''; if(/^\d{12}$/.test(v))return ''; if(/^L\d{10,}$/i.test(v))return '';
  return '이력번호는 보통 숫자 12자리, 묶음번호는 L로 시작합니다. 포장지 번호를 다시 확인해 주세요.'}
function haccpFlags(h){const st=SET();const f=[];
  [['fridge1','냉장고1'],['fridge2','냉장고2']].forEach(([k,l])=>{if(h[k]!==''&&h[k]!=null){const v=num(h[k]);if(v<st.fridgeMin||v>st.fridgeMax)f.push(l+' '+v+'℃')}});
  if(h.freezer!==''&&h.freezer!=null&&num(h.freezer)>st.freezerMax)f.push('냉동고 '+num(h.freezer)+'℃');
  ['clean','tools','worker','trace','pest'].forEach(k=>{if(h[k]==='아니오')f.push(HACCP_Q.find(q=>q[0]===k)[1])});
  return f}
function payCalc(p,emp){
  const st=SET(); emp=emp||{};
  const taxable=num(p.base)+num(p.ot)+num(p.bonus);
  const meal=Math.min(num(p.meal),st.mealFree);
  const mealTaxed=num(p.meal)-meal;
  const gross=taxable+num(p.meal);
  const tb=taxable+mealTaxed;
  const np=emp.np===false?0:f10(Math.min(tb,st.npCap)*st.np/100);
  const hi=emp.hi===false?0:f10(tb*st.hi/100);
  const ltc=emp.hi===false?0:f10(hi*st.ltcRatio/100);
  const ei=emp.ei===false?0:f10(tb*st.ei/100);
  const it=f10(num(p.incomeTax)); const lt=f10(it*0.1);
  const ded=np+hi+ltc+ei+it+lt;
  return {gross,taxable:tb,np,hi,ltc,ei,it,lt,ded,net:gross-ded};
}

const sortState={}, lastSheet={}, rangeState={};
function range(key,def){ if(!rangeState[key]){ const t=today(); rangeState[key]=def==='month'?{from:t.slice(0,8)+'01',to:t,p:'이번달',q:''}:{from:t,to:t,p:'오늘',q:''} } return rangeState[key] }
function setPreset(key,p){const t=today();const d=new Date();let from=t,to=t;
  if(p==='어제'){from=to=addDays(t,-1)}
  else if(p==='이번주'){from=addDays(t,-((d.getDay()+6)%7))}
  else if(p==='이번달'){from=t.slice(0,8)+'01'}
  else if(p==='지난달'){const x=new Date(d.getFullYear(),d.getMonth()-1,1);from=ymd(x);to=ymd(new Date(d.getFullYear(),d.getMonth(),0))}
  else if(p==='올해'){from=t.slice(0,4)+'-01-01'}
  else if(p==='전체'){from='';to=''}
  Object.assign(rangeState[key],{from,to,p})}
function rangeBar(key,withSearch){const r=rangeState[key];
  return `<div class="range noprint" data-range="${key}">${['오늘','어제','이번주','이번달','지난달','올해','전체'].map(p=>`<button data-preset="${p}" aria-pressed="${r.p===p}">${p}</button>`).join('')}
  <input type="date" data-rfrom value="${r.from}" aria-label="시작일"> ~ <input type="date" data-rto value="${r.to}" aria-label="종료일">
  ${withSearch?`<input class="srch" data-rq placeholder="찾기 (품목·거래처·이력번호)" value="${esc(r.q)}">`:''}</div>`}
function fmtCell(c,r){const v=c.get?c.get(r):r[c.k];
  if(c.t==='money')return v==null||v===''?'-':won(v);
  if(c.t==='kg')return v==null||v===''?'-':kgf(v);
  if(c.t==='pct')return pct(v);
  if(c.t==='date')return v?esc(v)+' ('+WEEK[new Date(v+'T00:00:00').getDay()]+')':'';
  return esc(v)}
function sheet(id,title,cols,rows,opt={}){
  const ss=sortState[id];
  if(ss){const c=cols.find(x=>x.k===ss.k);if(c){rows=rows.slice().sort((a,b)=>{let x=c.get?c.get(a):a[c.k],y=c.get?c.get(b):b[c.k];
    if(typeof x==='number'||typeof y==='number'){x=x??-Infinity;y=y??-Infinity;return ss.d*(x-y)}return ss.d*String(x??'').localeCompare(String(y??''),'ko')})}}
  lastSheet[id]={title,cols,rows};
  const sums=cols.map(c=>c.sum?rows.reduce((a,r)=>a+(num(c.get?c.get(r):r[c.k])),0):null);
  if(opt.foot)opt.foot(sums,cols,rows);
  const head=`<tr><th class="rn"></th>${cols.map(c=>`<th data-sort="${id}|${c.k}" class="${ss&&ss.k===c.k?'sorted'+(ss.d<0?' desc':''):''}" scope="col">${c.l}</th>`).join('')}</tr>`;
  const body=rows.length?rows.map((r,i)=>`<tr data-row="${id}|${esc(r.id||'')}" class="${opt.sel===r.id?'on':''}"><td class="rn">${i+1}</td>${cols.map(c=>{
      const v=c.get?c.get(r):r[c.k]; const cls=[c.t&&c.t!=='text'&&c.t!=='date'?'n':'',c.c?'c':'',(c.t==='money'||c.t==='pct')&&num(v)<0?'neg':'',c.flag&&c.flag(r)?'flag':''].join(' ');
      return `<td class="${cls}">${c.html?c.html(r):fmtCell(c,r)}</td>`}).join('')}</tr>`).join('')
    :`<tr><td class="empty" colspan="${cols.length+1}">${opt.empty||'아직 입력된 내용이 없습니다.'}</td></tr>`;
  const foot=rows.length&&sums.some(x=>x!=null)?`<tfoot><tr><td class="rn">합계</td>${cols.map((c,i)=>`<td class="${c.sum||c.footV?'n':''}">${c.footV?c.footV(sums,cols):(sums[i]==null?'':(c.t==='kg'?kgf(sums[i]):won(sums[i])))}</td>`).join('')}</tr></tfoot>`:'';
  return `<div class="sheetbar"><strong>${title}</strong><span class="cnt">${rows.length}줄</span><span class="sp"></span>
    <button class="btn sm xl noprint" data-export="${id}">엑셀로 내려받기</button>
    <button class="btn sm noprint" data-print>인쇄</button></div>
    <div class="sheetwrap"><table class="sheet"><thead>${head}</thead><tbody>${body}</tbody>${foot}</table></div>`;
}

function opts(list,val,blank){return (blank?`<option value="">${blank}</option>`:'')+list.map(o=>{const v=typeof o==='string'?o:o.v,t=typeof o==='string'?o:o.t;return `<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(t)}</option>`}).join('')}

   const saved=await put('payroll',row);editing.payroll=saved.id;render();flash('저장했습니다. 급여명세서 인쇄 버튼을 누를 수 있습니다.')};

function invoiceRows(month){const g={};
 S.sales.filter(s=>s.kind==='납품'&&ym(s.date)===month).forEach(s=>{const it=item(s.itemId);const k=(it.taxType==='과세'?'과세':'면세');const key=month+'_'+s.partnerId+'_'+k;
  const x=g[key]||(g[key]={id:key,month,partnerId:s.partnerId,kind:k,cnt:0,total:0});x.cnt++;x.total+=num(s.amount)});
 return Object.values(g).map(x=>{const p=partner(x.partnerId);const st=S.invoices.find(i=>i.id===x.id)||{};
  const supply=x.kind==='과세'?Math.round(x.total/1.1):x.total;
  return Object.assign(x,{name:p.name||'',bizNo:p.bizNo||'',doc:x.kind==='과세'?'세금계산서':'계산서',supply,vat:x.total-supply,issued:!!st.issued,approval:st.approval||'',issuedDate:st.issuedDate||'',
   due:ymd(new Date(+month.slice(0,4),+month.slice(5,7),10))})})}

 I.push({id:uid(),kind:'돼지',name:'양념 돼지불고기',part:'앞다리',price:18000,yieldPct:100,taxType:'과세'});

  {id:uid(),name:'행복식당',kind:'매출처',bizNo:'345-67-89012',ceo:'김대표'},{id:uid(),name:'□□요양원',kind:'매출처',bizNo:'456-78-90123'}];

    SA.push({id:uid(),date,kind:nap?'납품':'소매',partnerId:nap?P[2+Math.floor(rnd(0,2))].id:'',itemId:it.id,trace:it.taxType==='과세'?'':(traces[it.id]||''),weight:w,price:it.price,amount:Math.round(w*it.price/10)*10,pay:nap?'외상':['카드','카드','현금','계좌'][Math.floor(rnd(0,4))]})}
  if(d>0)HA.push({id:uid(),date,fridge1:+rnd(1,4).toFixed(1),fridge2:+rnd(1,5).toFixed(1),freezer:+rnd(-22,-18.5).toFixed(1),clean:'예',tools:'예',worker:'예',trace:'예',pest:'예',who:'사장'})}
 const E=[{id:uid(),name:'박직원',role:'발골',join:'2024-03-02',base:3200000,meal:200000,np:true,hi:true,ei:true},{id:uid(),name:'이직원',role:'판매',join:'2025-06-01',base:2400000,meal:200000,np:false,hi:true,ei:true}];
 let f=0; f+=await bulkPut('items',I); f+=await bulkPut('partners',P); f+=await bulkPut('purchases',PU); f+=await bulkPut('sales',SA); f+=await bulkPut('haccp',HA); f+=await bulkPut('staff',E);

/* ============ 파일 저장 (엑셀·백업) ============ */
let dl=null;
async function saveFile(name,data,msgEl){
 try{ if(dl===null&&window.claude&&window.claude.use) dl=await window.claude.use('downloads') }catch(e){}
 const blob=data instanceof Blob?data:new Blob([data]);
 if(dl){try{await dl.save({filename:name,data:blob});flash('파일을 저장했습니다: '+name,false,msgEl)}catch(e){if(e&&e.code!=='declined')flash('파일을 저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요.',true,msgEl)}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function exportSheet(id){const s=lastSheet[id];if(!s)return;const aoa=[s.cols.map(c=>c.l)];
 s.rows.forEach(r=>aoa.push(s.cols.map(c=>{const v=c.get?c.get(r):r[c.k];if(c.t==='pct')return isFinite(v)?Math.round(v*1000)/10:'';if(c.t==='money'||c.t==='kg')return v==null||v===''?'':Math.round(num(v)*1000)/1000;return v??''})));
 const name=(SET().shop||'정육마트')+'_'+s.title.replace(/[\\/:*?"<>|\s]/g,'')+'_'+today();
 if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=s.cols.map(c=>({wch:Math.max(8,c.l.length*2+2)}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,s.title.slice(0,30));
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});saveFile(name+'.xlsx',new Blob([buf]))}
 else{const csv='\ufeff'+aoa.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');saveFile(name+'.csv',csv)}}

 const pr=e.target.closest('[data-preset]');if(pr){const k=pr.closest('[data-range]').dataset.range;setPreset(k,pr.dataset.preset);
   const bar=pr.closest('[data-range]');bar.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',b===pr));bar.querySelector('[data-rfrom]').value=rangeState[k].from;bar.querySelector('[data-rto]').value=rangeState[k].to;refresh();return}
 const tf=e.target.closest('[data-tfilter]');if(tf){rangeState.trace.f=tf.dataset.tfilter;tf.parentElement.querySelectorAll('[data-tfilter]').forEach(b=>b.setAttribute('aria-pressed',b===tf));refresh();return}
 const so=e.target.closest('[data-sort]');if(so){const[id,k]=so.dataset.sort.split('|');const s=sortState[id];sortState[id]=s&&s.k===k?{k,d:-s.d}:{k,d:1};refresh();return}
 const ex=e.target.closest('[data-export]');if(ex){exportSheet(ex.dataset.export);return}
 if(e.target.closest('[data-print]')){try{window.print()}catch(err){}return}
 const row=e.target.closest('[data-row]');if(row){const[id,rid]=row.dataset.row.split('|');if(!rid)return;
   if(['sales','purchases','haccp','payroll','staff','items','partners'].includes(id)){editing[id]=rid;render();window.scrollTo({top:0});return}
   if(id==='invoice'){openInvoice(rid);return}
   if(id==='week'){rangeState.sales={from:rid,to:rid,p:'',q:''};go('sales');rangeState.sales={from:rid,to:rid,p:'',q:''};refresh();return}
   if(id==='trace'){rangeState.sales={from:'',to:'',p:'전체',q:rid};page='sales';editing={};nav();render();return}}
});
document.addEventListener('input',e=>{const bar=e.target.closest('[data-range]');if(!bar)return;const k=bar.dataset.range;const r=rangeState[k];
 if(e.target.matches('[data-rfrom]')){r.from=e.target.value;r.p=''}if(e.target.matches('[data-rto]')){r.to=e.target.value;r.p=''}if(e.target.matches('[data-rq]'))r.q=e.target.value;
 if(!e.target.matches('[data-rq]'))bar.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed','false'));refresh()});
