<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보험 보장분석 무료 신청 | 보험물어봄 by 다온</title>
<meta name="description" content="가입한 보험을 한 번에 모아 보장이 부족한지, 겹치는지 무료로 점검해 드립니다.">
<meta name="robots" content="index, follow">
<meta name="naver-site-verification" content="a09350fbdee79685108cbb46df68b0bb178bb94b">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="보험물어봄 by 다온">
<meta property="og:title" content="보험 보장분석 무료 신청">
<meta property="og:description" content="가입한 보험을 한 번에 모아 보장이 부족한지, 겹치는지 무료로 점검해 드립니다.">
<meta property="og:url" content="https://daon.io.kr/consult">
<meta name="theme-color" content="#0B1E42">
<link rel="canonical" href="https://daon.io.kr/consult">
<link rel="icon" type="image/png" href="/assets/favicon-daon.png">
<link rel="apple-touch-icon" href="/assets/favicon-daon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/consult.css?v=20261111">
</head>
<body>
<div class="app">
  <header class="cs-top">
    <a href="/" aria-label="보험물어봄 홈"><img src="/assets/logo-daon-wordmark.png" alt="다온파트너스" width="65" height="22"></a>
    <a class="call" href="tel:0415341124">📞 전화 상담</a>
  </header>

  <section class="cs-hero">
    <div class="ic">📋</div>
    <p class="kick">보장분석</p>
    <h1>가입한 보험,<br>한 번에 무료 점검</h1>
    <p class="sub">보장이 부족한지, 겹치는지, 보험료가 적정한지 정리해 드립니다.</p>
    <div class="cs-badges"><span>상담 비용 없음</span><span>신청만으로 가입되지 않음</span></div>
  </section>

  <section class="cs-sec">
    <h2><span class="n">1</span>지금 가입 상태</h2>
    <div class="fl"><span class="lb">가입한 보험 개수</span><div class="seg" data-k="policyCount"><button type="button" data-v="1to2">1~2개</button><button type="button" data-v="3to4">3~4개</button><button type="button" data-v="over5">5개 이상</button><button type="button" data-v="unknown">몰라요</button></div></div>
    <div class="fl"><span class="lb">마지막으로 점검한 때</span><div class="seg" data-k="lastCheck"><button type="button" data-v="under1">1년 안</button><button type="button" data-v="1to3">1~3년</button><button type="button" data-v="over3">3년 넘음</button><button type="button" data-v="never">안 해봤어요</button></div></div>
    <div class="fl"><span class="lb">담당 설계사와 연락이 되나요?</span><div class="seg" data-k="advisorContact"><button type="button" data-v="good">잘 돼요</button><button type="button" data-v="sometimes">가끔</button><button type="button" data-v="bad">안 돼요</button><button type="button" data-v="none">없어요</button></div></div>
  </section>
  <section class="cs-sec">
    <h2><span class="n">2</span>점검 받고 싶은 것</h2>
    <div class="fl"><div class="opts" data-k="concern"><button type="button" class="opt" data-v="premium"><span class="i">💰</span><span><b>보험료가 부담돼요</b></span></button><button type="button" class="opt" data-v="lacking"><span class="i">🛡️</span><span><b>보장이 부족할까 봐</b></span></button><button type="button" class="opt" data-v="overlap"><span class="i">🔁</span><span><b>중복 가입이 걱정돼요</b></span></button><button type="button" class="opt" data-v="overhaul"><span class="i">🧹</span><span><b>이참에 전체 정리</b></span></button></div></div>
    <div class="fl"><span class="lb">점검 받을 사람</span><div class="seg" data-k="familyScope"><button type="button" data-v="self">본인만</button><button type="button" data-v="spouse">배우자도</button><button type="button" data-v="child">자녀도</button><button type="button" data-v="all">가족 전체</button></div></div>
  </section>
  <div data-contact></div>
  <footer class="cs-legal"></footer>
</div>
<script src="/assets/consult.js?v=20261111"></script>
<script>
DaonConsult({
  api: 'https://daonpartners.app.n8n.cloud/webhook/daon-health-lead', contactNo: 3,
  validate: function(a){
    if (!a.S.policyCount) return ['가입한 보험 개수를 골라주세요', document.querySelector('[data-k=policyCount]')];
    if (!a.S.concern) return ['점검 받고 싶은 것을 골라주세요', document.querySelector('[data-k=concern]')];
  },
  payload: function(a){
    var T = { '1to2':'1~2개', '3to4':'3~4개', over5:'5개 이상', unknown:'모름', under1:'1년 안', '1to3':'1~3년', over3:'3년 넘음', never:'안 해봄', good:'잘 됨', sometimes:'가끔', bad:'안 됨', none:'없음', premium:'보험료 부담', lacking:'보장 부족 걱정', overlap:'중복 가입 걱정', overhaul:'전체 정리', self:'본인만', spouse:'배우자도', child:'자녀도', all:'가족 전체' };
    return { interests: ['보장분석'], interestEtc: '가입 ' + T[a.S.policyCount] + ' · 마지막 점검 ' + (T[a.S.lastCheck] || '-') + ' · 설계사 연락 ' + (T[a.S.advisorContact] || '-') + ' · 점검: ' + T[a.S.concern] + ' · 대상 ' + (T[a.S.familyScope] || '-'), origin: '보장분석 신청',
      answers: { policyCount: a.S.policyCount, lastCheck: a.S.lastCheck || '', advisorContact: a.S.advisorContact || '', concern: a.S.concern, familyScope: a.S.familyScope || '' } };
  }
});
</script>
<script src="/assets/home-btn.js" defer></script>
</body>
</html>
