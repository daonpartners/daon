<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>암보험 비교 상담 | 보험물어봄 by 다온</title>

<meta name="robots" content="index, follow">
<meta name="naver-site-verification" content="a09350fbdee79685108cbb46df68b0bb178bb94b">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="보험물어봄 by 다온">
<meta property="og:title" content="암보험 비교 상담">
<meta property="og:description" content="가입한 암보험이 충분한지, 보험료가 적정한지 무료로 비교해 드립니다.">
<meta property="og:url" content="https://daon.io.kr/cancer-consult">
<meta name="theme-color" content="#0B1E42">
<link rel="canonical" href="https://daon.io.kr/cancer-consult">
<link rel="icon" type="image/png" href="/assets/favicon-daon.png">
<link rel="apple-touch-icon" href="/assets/favicon-daon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/consult.css?v=20261111">
</head>
<body>
<div class="app">
  <header class="cs-top">
    <a href="/" aria-label="보험물어봄 홈"><img src="/assets/logo-daon-wordmark.png" alt="다온파트너스" width="65" height="22"></a>
    <a class="call" href="tel:0415341124">📞 전화 상담</a>
  </header>

  <section class="cs-hero">
    <div class="ic">🎗️</div>
    <p class="kick">암보험 비교</p>
    <h1>지금 암보험,<br>충분한지 비교해 드려요</h1>
    <p class="sub">세 가지만 골라주세요. 가입한 보장과 요즘 상품을 비교해서 알려드립니다.</p>
    <div class="cs-badges"><span>상담 비용 없음</span><span>신청만으로 가입되지 않음</span></div>
  </section>

  <section class="cs-sec">
    <h2><span class="n">1</span>지금 가입 상태</h2>
    <div class="fl"><span class="lb">암보험이 몇 개 있나요?</span><div class="seg" data-k="hasPolicy"><button type="button" data-v="one">1개</button><button type="button" data-v="multi">2개 이상</button><button type="button" data-v="none">없어요</button><button type="button" data-v="unknown">몰라요</button></div></div>
    <div class="fl"><span class="lb">가입한 지 얼마나 됐나요?</span><div class="seg" data-k="joinedYears"><button type="button" data-v="under1">1년 안</button><button type="button" data-v="1to5">1~5년</button><button type="button" data-v="5to10">5~10년</button><button type="button" data-v="over10">10년 넘음·모름</button></div></div>
  </section>
  <section class="cs-sec">
    <h2><span class="n">2</span>가장 궁금한 것</h2>
    <div class="fl"><div class="opts" data-k="concern"><button type="button" class="opt" data-v="enough"><span class="i">🛡️</span><span><b>보장이 충분한지</b></span></button><button type="button" class="opt" data-v="premium"><span class="i">💰</span><span><b>보험료가 적정한지</b></span></button><button type="button" class="opt" data-v="overlap"><span class="i">🔁</span><span><b>중복 가입인지</b></span></button><button type="button" class="opt" data-v="renewal"><span class="i">🔄</span><span><b>갱신형인지</b></span></button></div></div>
  </section>
  <div data-contact></div>
  <footer class="cs-legal"></footer>
</div>
<script src="/assets/consult.js?v=20261111"></script>
<script>
DaonConsult({
  api: 'https://daonpartners.app.n8n.cloud/webhook/daon-health-lead', contactNo: 3,
  validate: function(a){
    if (!a.S.hasPolicy) return ['암보험 가입 개수를 골라주세요', document.querySelector('[data-k=hasPolicy]')];
    if (!a.S.concern) return ['가장 궁금한 것을 골라주세요', document.querySelector('[data-k=concern]')];
  },
  payload: function(a){
    var T = { one:'1개', multi:'2개 이상', none:'없음', unknown:'모름', under1:'1년 안', '1to5':'1~5년', '5to10':'5~10년', over10:'10년 넘음·모름', enough:'보장이 충분한지', premium:'보험료가 적정한지', overlap:'중복 가입인지', renewal:'갱신형인지' };
    return { interests: ['암보험 비교'], interestEtc: '암보험 ' + T[a.S.hasPolicy] + ' · 가입 ' + (T[a.S.joinedYears] || '-') + ' · 궁금: ' + T[a.S.concern], origin: '암보험 비교 상담',
      answers: { hasPolicy: a.S.hasPolicy, joinedYears: a.S.joinedYears || '', concern: a.S.concern } };
  }
});
</script>
<script src="/assets/home-btn.js" defer></script>
</body>
</html>
