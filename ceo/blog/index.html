<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블로그 홍보 | 보험물어봄 by 다온</title>
<meta name="description" content="보험물어봄 by 다온 칼럼에 우리 가게 소개 글을 올리거나, 사장님 블로그 운영을 도와드립니다.">
<meta name="robots" content="index, follow">
<meta name="naver-site-verification" content="a09350fbdee79685108cbb46df68b0bb178bb94b">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="보험물어봄 by 다온">
<meta property="og:title" content="블로그 홍보">
<meta property="og:description" content="보험물어봄 by 다온 칼럼에 우리 가게 소개 글을 올리거나, 사장님 블로그 운영을 도와드립니다.">
<meta property="og:url" content="https://daon.io.kr/ceo/blog">
<meta name="theme-color" content="#0B1E42">
<link rel="canonical" href="https://daon.io.kr/ceo/blog">
<link rel="icon" type="image/png" href="/assets/favicon-daon.png">
<link rel="apple-touch-icon" href="/assets/favicon-daon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/consult.css?v=20261111b">
</head>
<body>
<div class="app">
  <header class="cs-top">
    <a href="/" aria-label="보험물어봄 홈"><img src="/assets/logo-daon-wordmark.png" alt="다온파트너스" width="65" height="22"></a>
    <a class="call" href="tel:0415341124">📞 전화 상담</a>
  </header>

  <section class="cs-hero">
    <div class="ic">📝</div>
    <p class="kick">블로그 홍보</p>
    <h1>검색하면 나오는<br>우리 가게 소개 글</h1>
    <p class="sub">다온 칼럼에 가게 소개 글을 올리거나, 사장님 블로그에 올릴 글을 대신 써 드립니다.</p>
    <div class="cs-badges"><span>상담 비용 없음</span><span>보험 가입과 무관</span></div>
    <div class="rule"><b>'광고' 표시 원칙</b><p>대가를 받고 쓰는 소개 글은 공정거래위원회 기준에 따라 글의 제목 또는 첫 부분에 '광고'를 표시합니다.</p></div>
  </section>

  <section class="cs-sec">
    <h2><span class="n">1</span>우리 가게</h2>
    <div class="fl"><label for="sShop">상호</label><input class="inp" id="sShop" maxlength="40" placeholder="예) 다온식당"></div>
    <div class="fl"><label for="sPlace">네이버 플레이스 주소 <small>모르면 비워두세요</small></label><input class="inp" id="sPlace" maxlength="200" placeholder="naver.me/... 또는 지도 주소"></div>
    <div class="fl"><label for="sArea">지역</label><input class="inp" id="sArea" maxlength="40" placeholder="예) 아산시 탕정면"></div>
    <div class="fl"><span class="lb">업종</span><div class="seg" data-k="biz"><button type="button" data-v="식당·카페">식당·카페</button><button type="button" data-v="미용·네일·피부">미용·뷰티</button><button type="button" data-v="학원·교육">학원</button><button type="button" data-v="인테리어·청소">인테리어·청소</button><button type="button" data-v="병의원·약국">병의원·약국</button><button type="button" data-v="판매·서비스">판매·서비스</button><button type="button" data-v="제조·공장">제조</button><button type="button" data-v="기타">기타</button></div></div>
  </section>
  <section class="cs-sec">
    <h2><span class="n">2</span>원하는 방식</h2>
    <div class="fl"><div class="opts multi" data-k="items"><button type="button" class="opt" data-v="다온 칼럼 소개 글"><span class="i">📰</span><span><b>다온 칼럼에 소개</b><small>daon.io.kr에 가게 소개 글</small></span></button><button type="button" class="opt" data-v="사장님 블로그 운영"><span class="i">✍️</span><span><b>사장님 블로그 운영</b><small>사장님 블로그에 올릴 글 작성</small></span></button></div></div>
    <div class="fl"><label for="sPoint">알리고 싶은 것 3가지</label><textarea class="inp" id="sPoint" placeholder="예) 직접 만든 생면 파스타, 주차 3대, 단체석 20명" maxlength="300"></textarea></div>
    <div class="fl"><label class="photo"><input type="file" accept="image/*" data-photo="shop"><span class="ph">📷</span><span><b>가게 사진 (선택)</b><small>대표 메뉴나 외관 1장</small></span></label></div>
  </section>
  <div data-contact></div>
  <footer class="cs-legal"></footer>
</div>
<script src="/assets/consult.js?v=20261111b"></script>
<script>
DaonConsult({
  api: 'https://daonpartners.app.n8n.cloud/webhook/daon-ceo-lead', operator: 'daon', noBirth: true, kakaoFallback: true, whoTitle: '연락받으실 사장님',
  doneTips: ['보험 가입 여부와 관계없이 같은 조건으로 도와드립니다.', '주변에 도움이 필요한 사장님이 계시면 이 페이지를 공유해 주세요.'],
  contactNo: 3, sendText: '블로그 홍보 신청하기',
  validate: function(a){
    if (!a.v('sShop')) return ['상호를 적어주세요', 'sShop'];
    if (!a.S.biz) return ['업종을 골라주세요', document.querySelector('[data-k=biz]')];
    if (!a.S.items.length) return ['원하는 방식을 골라주세요', document.querySelector('[data-k=items]')];
  },
  payload: function(a){ return { service: '블로그 홍보', items: a.S.items, detail: '알리고 싶은 것: ' + (a.v('sPoint') || '-') + (a.PHOTOS.shop ? ' / 사진 첨부(용량상 카톡으로 다시 받기)' : ''), shop: a.v('sShop'), place: a.v('sPlace') || '-', area: a.v('sArea') || '-', biz: a.S.biz }; }
});
</script>
<script src="/assets/home-btn.js" defer></script>
</body>
</html>
