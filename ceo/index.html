<body>
<div class="app">
  <header class="cs-top">
    <a href="/" aria-label="보험물어봄 홈"><img src="/assets/logo-daon-wordmark.png" alt="다온파트너스" width="65" height="22"></a>
    <a class="call" href="tel:0415341124">📞 전화 상담</a>
  </header>

  <section class="cs-hero">
    <div class="ic">🏪</div>
    <p class="kick">사장님 전용관</p>
    <h1>사장님 가게,<br>손님이 찾아오게</h1>
    <p class="sub">필요한 것만 골라 한 번에 신청하세요. 다온파트너스가 연락드립니다.</p>
    <div class="cs-badges"><span>상담 비용 없음</span><span>보험 가입과 무관</span></div>
    <div class="svc">
      <a href="/ceo/diagnosis/"><span>🔍</span><b>무료 가게 진단</b><small>플레이스 순위·리뷰 A4 1장</small></a>
      <a href="/ceo/review/"><span>⭐</span><b>리뷰 관리</b><small>답글·리뷰 요청 동선</small></a>
      <a href="/ceo/blog/"><span>📝</span><b>블로그 홍보</b><small>우리 가게 소개 글</small></a>
      <a href="/ceo/plan/"><span>📣</span><b>마케팅 월 관리</b><small>첫 달 무료 후 선택</small></a>
      <a href="/store/"><span>🤝</span><b>다온 제휴업체</b><small>소개·제휴 신청</small></a>
      <a href="/ceo/insurance/"><span>🛡️</span><b>사업장 보험</b><small>의무보험·화재·배상</small></a>
    </div>
  </section>

  <section class="cs-sec">
    <h2><span class="n">1</span>우리 가게</h2>
    <div class="fl"><label for="sShop">상호</label><input class="inp" id="sShop" maxlength="40" placeholder="예) 다온식당"></div>
    <div class="fl"><label for="sPlace">네이버 플레이스 주소 <small>모르면 비워두세요</small></label><input class="inp" id="sPlace" maxlength="200" placeholder="naver.me/... 또는 지도 주소"></div>
    <div class="fl"><label for="sArea">지역</label><input class="inp" id="sArea" maxlength="40" placeholder="예) 아산시 탕정면"></div>
    <div class="fl"><span class="lb">업종</span><div class="seg" data-k="biz"><button type="button" data-v="식당·카페">식당·카페</button><button type="button" data-v="미용·네일·피부">미용·뷰티</button><button type="button" data-v="학원·교육">학원</button><button type="button" data-v="인테리어·청소">인테리어·청소</button><button type="button" data-v="병의원·약국">병의원·약국</button><button type="button" data-v="판매·서비스">판매·서비스</button><button type="button" data-v="제조·공장">제조</button><button type="button" data-v="기타">기타</button></div></div>
  </section>
  <section class="cs-sec">
    <h2><span class="n">2</span>필요한 것 (여러 개 가능)</h2>
    <div class="fl"><div class="opts multi" data-k="items"><button type="button" class="opt" data-v="무료 가게 진단"><span class="i">🔍</span><span><b>무료 가게 진단</b></span></button><button type="button" class="opt" data-v="리뷰 관리"><span class="i">⭐</span><span><b>리뷰 관리</b></span></button><button type="button" class="opt" data-v="블로그 홍보"><span class="i">📝</span><span><b>블로그 홍보</b></span></button><button type="button" class="opt" data-v="마케팅 월 관리"><span class="i">📣</span><span><b>마케팅 월 관리</b></span></button><button type="button" class="opt" data-v="제휴업체 등록"><span class="i">🤝</span><span><b>제휴업체 등록</b></span></button></div></div>
    <p class="box-note">🛡️ 사업장 보험 상담은 따로 받습니다. <a href="/ceo/insurance/" style="color:var(--navy);font-weight:800">사업장 보험 보러 가기 ›</a></p>
  </section>
  <div data-contact></div>
  <footer class="cs-legal"></footer>
</div>
<script src="/assets/consult.js?v=20261111b"></script>
<script>
DaonConsult({
  api: 'https://daonpartners.app.n8n.cloud/webhook/daon-ceo-lead', operator: 'daon', noBirth: true, kakaoFallback: true, whoTitle: '연락받으실 사장님',
  doneTips: ['보험 가입 여부와 관계없이 같은 조건으로 도와드립니다.', '주변에 도움이 필요한 사장님이 계시면 이 페이지를 공유해 주세요.'],
  contactNo: 3, sendText: '체크한 것 한 번에 신청',
  validate: function(a){
    if (!a.v('sShop')) return ['상호를 적어주세요', 'sShop'];
    if (!a.S.biz) return ['업종을 골라주세요', document.querySelector('[data-k=biz]')];
    if (!a.S.items.length) return ['필요한 것을 하나 이상 골라주세요', document.querySelector('[data-k=items]')];
  },
  payload: function(a){ return { service: '전용관 묶음 신청', items: a.S.items, shop: a.v('sShop'), place: a.v('sPlace') || '-', area: a.v('sArea') || '-', biz: a.S.biz }; }
});
</script>
<script src="/assets/home-btn.js" defer></script>
</body>
</html>
