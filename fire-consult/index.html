<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>화재보험 가설계 신청 | 보험물어봄 by 다온</title>
<meta name="description" content="아파트·주택 주소만 알려주시면 화재보험 가설계를 만들어 드립니다. 상담 비용 없음.">
<meta name="robots" content="index, follow">
<meta name="naver-site-verification" content="a09350fbdee79685108cbb46df68b0bb178bb94b">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="보험물어봄 by 다온">
<meta property="og:title" content="화재보험 가설계 신청">
<meta property="og:description" content="아파트·주택 주소만 알려주시면 화재보험 가설계를 만들어 드립니다. 상담 비용 없음.">
<meta property="og:url" content="https://daon.io.kr/fire-consult">
<meta name="theme-color" content="#0B1E42">
<link rel="canonical" href="https://daon.io.kr/fire-consult">
<link rel="icon" type="image/png" href="/assets/favicon-daon.png">
<link rel="apple-touch-icon" href="/assets/favicon-daon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/consult.css?v=20261111">
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" async></script>
</head>
<body>
<div class="app">
  <header class="cs-top">
    <a href="/" aria-label="보험물어봄 홈"><img src="/assets/logo-daon-wordmark.png" alt="다온파트너스" width="65" height="22"></a>
    <a class="call" href="tel:0415341124">📞 전화 상담</a>
  </header>

  <section class="cs-hero">
    <div class="ic">🔥</div>
    <p class="kick">주택 화재보험</p>
    <h1>우리 집 화재보험,<br>주소만 알려주세요</h1>
    <p class="sub">아파트·빌라·주택 화재보험 가설계를 만들어 보내드립니다.</p>
    <div class="cs-badges"><span>상담 비용 없음</span><span>신청만으로 가입되지 않음</span></div>
  </section>

  <section class="cs-sec">
    <h2><span class="n">1</span>가입할 집</h2>
    <div class="fl"><label for="fAddr">주소</label><div class="addr"><input class="inp" id="fAddr" readonly placeholder="주소 검색을 눌러주세요"><button type="button" data-addr="fAddr" data-next="fDetail">주소 검색</button></div></div>
    <div class="fl"><label for="fDetail">동·호수</label><input class="inp" id="fDetail" placeholder="예) 101동 1203호" maxlength="40"></div>
    <div class="fl"><span class="lb">집 종류</span><div class="seg" data-k="house"><button type="button" data-v="아파트">아파트</button><button type="button" data-v="빌라·연립">빌라·연립</button><button type="button" data-v="단독주택">단독주택</button></div></div>
    <div class="fl"><span class="lb">살고 계신 형태</span><div class="seg" data-k="own"><button type="button" data-v="자가">내 집</button><button type="button" data-v="전세·월세">전세·월세</button></div></div>
  </section>
  <section class="cs-sec">
    <h2><span class="n">2</span>함께 넣을 보장</h2>
    <div class="fl"><span class="lb">일상생활배상책임 <small>집에서 이웃에게 물이 새는 등 남에게 피해를 줬을 때</small></span><div class="seg" data-k="liab"><button type="button" data-v="추가 원함">넣을래요</button><button type="button" data-v="필요 없음">괜찮아요</button><button type="button" data-v="잘 모름">잘 모름</button></div></div>
    <p class="box-note">일상생활배상책임은 이미 다른 보험에 들어 있을 수 있어요. 중복 여부는 상담 때 확인해 드립니다.</p>
  </section>
  <div data-contact></div>
  <footer class="cs-legal"></footer>
</div>
<script src="/assets/consult.js?v=20261111"></script>
<script>
DaonConsult({
  api: 'https://daonpartners.app.n8n.cloud/webhook/daon-fire-lead', contactNo: 3,
  doneTips: ['관리비 고지서나 등기부의 주소를 확인해 두시면 가설계가 정확해집니다.'],
  validate: function(a){
    if (!a.v('fAddr')) return ['가입할 집 주소를 검색해 주세요', document.querySelector('[data-addr]')];
    if (!a.S.house) return ['집 종류를 골라주세요', document.querySelector('[data-k=house]')];
    if (!a.S.own) return ['살고 계신 형태를 골라주세요', document.querySelector('[data-k=own]')];
  },
  payload: function(a){
    return { address: a.v('fAddr'), addressDetail: a.v('fDetail'), ownership: a.S.own + ' · ' + a.S.house, liability: a.S.liab || '-' };
  }
});
</script>
<script src="/assets/home-btn.js" defer></script>
</body>
</html>
