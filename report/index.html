<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홍보 보고서 | 다온파트너스</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14110F">
<link rel="icon" type="image/png" href="/assets/favicon-daon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ink:#14110F;--cream:#FFF7EC;--paper:#FFFDF8;--red:#FF4F2E;--yel:#FFC83D;--mint:#2EC4A0;--sub:#6E6560;--line:#EADFD2}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
header{background:var(--ink);color:#fff;padding:18px 0 30px}
.logo{font-weight:900;font-size:17px;text-decoration:none;color:#fff}.logo b{color:var(--red)}
h1{font-size:clamp(28px,6vw,40px);font-weight:900;letter-spacing:-.03em;margin:18px 0 4px;line-height:1.2}
header p{margin:0;color:#E9DED4}
h2{font-size:22px;font-weight:900;letter-spacing:-.02em;margin:34px 0 12px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:-18px}
.sum div{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:4px 4px 0 var(--ink)}
.sum b{display:block;font-size:30px;font-weight:900;line-height:1.1}
.sum span{font-size:14px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{font-size:14px;font-weight:700;background:var(--cream);border-radius:999px;padding:4px 12px}
.month{font-weight:900;margin:22px 0 8px;color:var(--red)}
.post{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.post .d{font-size:13px;color:var(--sub);white-space:nowrap}
.post .c{font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.post .t{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post a{font-size:14px;font-weight:800;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;text-decoration:none;white-space:nowrap}
.mt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mt th,.mt td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;font-size:15px;white-space:nowrap}
.mt th:first-child,.mt td:first-child{text-align:left}
.mt thead th{background:var(--cream);font-weight:900}
.up{color:#0E8A4F;font-size:12px;font-weight:800;display:block}.down{color:#B4280F;font-size:12px;font-weight:800;display:block}
.scroll{overflow-x:auto}
.note{font-size:14px;color:var(--sub)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--sub);text-align:center}
.memo{background:#FFF4D6;border-radius:12px;padding:10px 14px;margin-top:10px;font-size:15px}
footer{color:var(--sub);font-size:13px;padding:30px 0 40px}
@media (max-width:640px){.sum{grid-template-columns:1fr 1fr}.post{flex-wrap:wrap}.post .t{flex-basis:100%;order:3;white-space:normal}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="/">다온<b>파트너스</b></a>
  <h1 id="name">홍보 보고서</h1>
  <p id="sub">불러오는 중…</p>
</div></header>
<main class="wrap">
  <div class="sum" id="sum" hidden></div>
  <div id="body"></div>
</main>
<footer class="wrap">성과 숫자는 네이버 스마트플레이스 통계, 인스타그램 인사이트 등 각 플랫폼 화면의 값을 매월 옮겨 적은 것입니다. 날씨·계절·광고 등 다른 요인도 함께 영향을 줍니다.</footer>
<script>
(function(){
var API='https://daonpartners.app.n8n.cloud/webhook/daon-report';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var COL={'플레이스 새소식':'#0E9F57','블로그':'#2F6BFF','인스타그램':'#C13584','인스타 릴스':'#E1306C','유튜브 쇼츠':'#E62117','네이버 클립':'#03C75A','구글 프로필':'#4285F4','다온 블로그':'#14110F','다온 인스타':'#14110F','다온 카톡채널':'#14110F','당근':'#FF7E36'};
var MET=[['place_views','플레이스 조회'],['place_calls','전화 문의'],['place_route','길찾기'],['place_saves','저장'],['review_count','리뷰 수'],['insta_reach','인스타 도달'],['insta_follow','인스타 팔로워'],['video_views','영상 조회']];
var sid=(new URLSearchParams(location.search).get('s')||'').toLowerCase();
if(!/^[a-z0-9]{12}$/.test(sid)){$('sub').textContent='주소가 올바르지 않습니다. 받으신 링크를 다시 눌러 주세요.';return}
fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'view',store_id:sid})})
 .then(function(r){if(!r.ok)throw 0;return r.json()}).then(render)
 .catch(function(){$('sub').textContent='보고서를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.'});
function ym(s){var p=String(s).split('-');return p[0]+'년 '+(+p[1])+'월'}
function render(d){
  if(!d||!d.ok){$('sub').textContent='보고서를 찾을 수 없습니다.';return}
  var s=d.store;document.title=s.name+' 홍보 보고서 | 다온파트너스';
  $('name').textContent=s.name+' 홍보 보고서';
  $('sub').textContent=[s.area,s.type].filter(Boolean).join(' · ')+(s.start?' · '+s.start.replace(/-/g,'.')+' 시작':'');
  var posts=d.posts||[],mets=d.metrics||[];
  var now=new Date(Date.now()+9*3600e3).toISOString().slice(0,7);
  var thisM=posts.filter(function(p){return (p.date||'').slice(0,7)===now});
  var chans={};posts.forEach(function(p){chans[p.channel]=1});
  var last=mets[mets.length-1]||{},first=mets[0]||{};
  $('sum').innerHTML='<div><b>'+thisM.length+'</b><span>이번 달 올린 글·영상</span></div><div><b>'+posts.length+'</b><span>지금까지 전체</span></div><div><b>'+Object.keys(chans).length+'</b><span>올린 곳(채널)</span></div><div><b>'+(last.place_views!=null?last.place_views.toLocaleString():'–')+'</b><span>최근 월 플레이스 조회</span></div>';
  $('sum').hidden=false;
  var h='<h2>어디에 올렸나</h2>';
  if(!posts.length)h+='<div class="empty">아직 올린 기록이 없습니다.</div>';
  else{
    var cnt={};posts.forEach(function(p){cnt[p.channel]=(cnt[p.channel]||0)+1});
    h+='<div class="chips">'+Object.keys(cnt).map(function(c){return '<span class="chip">'+esc(c)+' '+cnt[c]+'건</span>'}).join('')+'</div>';
    var cur='';posts.forEach(function(p){var m=(p.date||'').slice(0,7);if(m!==cur){cur=m;h+='<div class="month">'+ym(m)+'</div>'}
      h+='<div class="post"><span class="d">'+esc((p.date||'').slice(5).replace('-','.'))+'</span><span class="c" style="background:'+(COL[p.channel]||'#6E6560')+'">'+esc(p.channel)+'</span><span class="t">'+esc(p.title||'(제목 없음)')+(p.memo?' <span class="note">· '+esc(p.memo)+'</span>':'')+'</span>'+(p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">보기</a>':'')+'</div>'});
  }
  h+='<h2>성과</h2>';
  if(!mets.length)h+='<div class="empty">아직 입력된 성과가 없습니다. 매월 초에 지난달 숫자를 넣어 드립니다.</div>';
  else{
    var cols=MET.filter(function(k){return mets.some(function(m){return m[k[0]]!=null})});
    h+='<div class="scroll"><table class="mt"><thead><tr><th>월</th>'+cols.map(function(k){return '<th>'+k[1]+'</th>'}).join('')+'</tr></thead><tbody>';
    mets.forEach(function(m,i){h+='<tr><td>'+ym(m.month)+(i===0?' <span class="note">(기준)</span>':'')+'</td>'+cols.map(function(k){var v=m[k[0]];if(v==null)return '<td>–</td>';var b=first[k[0]],ch='';
      if(i>0&&b!=null&&b>0){var pct=Math.round((v-b)/b*100);ch='<span class="'+(pct>=0?'up':'down')+'">기준 대비 '+(pct>=0?'+':'')+pct+'%</span>'}
      return '<td>'+v.toLocaleString()+ch+'</td>'}).join('')+'</tr>'});
    h+='</tbody></table></div>';
    mets.slice().reverse().forEach(function(m){if(m.memo)h+='<div class="memo"><b>'+ym(m.month)+'</b> '+esc(m.memo)+'</div>'});
  }
  $('body').innerHTML=h;
}
})();
</script>
</body>
</html>
