<!DOCTYPE html>

<style>
:root{--ink:#14161A;--ink-2:#3A4048;--steel:#6B7480;--line:#E4E7EA;--navy:#0B1E42;--navy2:#16305C;--orange:#E39BA5;--deep:#A85F6C;--tint:#F9E9EC;--gray:#EEF1F6;--display:'Noto Serif KR',serif;--body:'Pretendard',-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.top__in{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.top img{height:26px;display:block}
.top nav{display:flex;gap:6px}
.top nav a{font-size:12.5px;font-weight:700;text-decoration:none;padding:8px 14px;border-radius:999px;background:var(--gray);color:var(--navy)}
.top nav a.pk{background:var(--orange);color:var(--navy)}
.hd{background:var(--navy);color:#fff}
.hd__in{max-width:1040px;margin:0 auto;padding:40px 20px 34px}
.hd p{color:var(--orange);font-weight:700;font-size:14px}
.hd h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,7vw,44px);letter-spacing:-.02em;line-height:1.25;margin-top:6px}
.hd .sub{color:#C9D3E1;margin-top:10px;font-size:15px;max-width:34em}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
.lbl{font-size:13px;font-weight:800;color:var(--steel);margin-bottom:8px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.cats button{font:inherit;font-size:14.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--navy);padding:9px 14px;border-radius:999px;cursor:pointer}
.cats button em{font-style:normal;font-size:12px;color:var(--steel);margin-left:2px}
.cats button.zero{color:#A8AFB8}
.cats button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.cats button[aria-pressed="true"] em{color:#F6DDE1}
.cats button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.tag.t2{color:#3A4048;background:#EEF1F6}
.tag{display:inline-block;align-self:flex-start;font-size:12px;font-weight:800;color:var(--deep);background:var(--tint);padding:4px 10px;border-radius:6px;margin-bottom:10px}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.who button{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);padding:8px 14px;border-radius:999px;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.who button:focus-visible,.card:focus-visible,.act a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.list{display:grid;gap:14px}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
.card{display:flex;flex-direction:column;text-decoration:none;border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff}
.card:hover{border-color:var(--deep)}
.card h2{font-family:var(--display);font-size:19px;line-height:1.45;color:var(--navy)}
.card .ex{margin-top:8px;font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.by{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:13px;color:var(--steel)}
.by img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;background:var(--gray)}
.by b{color:var(--ink);font-size:14px}
.state{color:var(--steel);padding:30px 0}
.art{max-width:680px;margin:0 auto}
.back{display:inline-block;font-size:14px;font-weight:700;color:var(--deep);text-decoration:none;margin-bottom:16px}
.art h1{font-family:var(--display);font-weight:900;font-size:clamp(24px,6vw,34px);line-height:1.35;color:var(--navy);letter-spacing:-.015em}
.art .by{margin-top:14px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.body{margin-top:22px;font-size:17px;line-height:1.95}
.body p+p{margin-top:14px}
.body p.note{font-size:13px;color:var(--steel);line-height:1.6}
.author{margin-top:36px;background:var(--tint);border-radius:16px;padding:20px;display:grid;gap:14px}
.author .row{display:flex;gap:14px;align-items:center}
.author img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:top;background:#fff}
.author b{font-family:var(--display);font-size:20px;color:var(--navy)}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act a{text-align:center;text-decoration:none;font-weight:800;font-size:14px;padding:13px 6px;border-radius:10px}
.act .a1{background:var(--navy);color:#fff}.act .a2{background:#fff;color:var(--deep)}
.more{margin-top:36px}
.more h3{font-family:var(--display);font-size:18px;color:var(--navy);margin-bottom:10px}
.more a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:700}
.foot{background:var(--navy2);color:#8FA0B3;font-size:11.5px;line-height:1.8;text-align:center;padding:26px 20px 34px}
html,body{max-width:100%;overflow-x:clip}
</style>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/app-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보험물어봄">
</head>
<body>
<header class="top"><div class="top__in">
  <a href="/"><img src="/assets/logo-daon-wordmark.png" alt="다온파트너스"></a>
  <nav><a class="pk" href="/qna/">질문하기</a><a href="/#fp">설계사 고르기</a><a href="/claim/app/?m=daon">보험금 청구</a></nav>
</div></header>

<section class="hd" id="hd"><div class="hd__in">
  <p>보험물어봄 <span style="font-weight:600;color:#C9D3E1;font-size:.8em">by 다온</span></p>
  <h1>설계사 칼럼</h1>
  <div class="sub">다온 설계사가 직접 쓴 보험 이야기입니다. 상품·보험사마다 내용이 다를 수 있으니 가입 전 약관을 꼭 확인하세요.</div>
</div></section>

<main class="wrap" id="main"><p class="state">칼럼을 불러오는 중입니다</p></main>

<footer class="foot">
  보험대리점 등록번호 2014048012 · 보험설계사 등록번호 20150978060015<br>
  전화 041-534-1124 · 팩스 041-534-1126 · 개인정보 보호책임자 다온파트너스 041-534-1124<br>
  다온파트너스(884-14-02999) · 충남 아산시 탕정면 용머리길 22 브라운스톤갤럭시 C동 301호
</footer>

<script>
(function(){
  var API='https://daonpartners.app.n8n.cloud/webhook/daon-column-list';
  var q=new URLSearchParams(location.search), id=q.get('id')||'', a=q.get('a')||'', cq=q.get('c')||'';
  var CATS=['실손·보험금청구','간병·치매','암·뇌·심장','건강·수술','어린이','자동차·운전자','화재·배상책임','사업장·소상공인','펫','연금·종신','기타'];
  var main=document.getElementById('main');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function img(u){ u=String(u||''); return /^https?:\/\//.test(u)?u:'/assets/favicon-daon.png'; }
  function lines(t){ return String(t||'').split(/\n+/).map(function(x){return x.trim();}).filter(Boolean); }
  function by(c){ return '<div class="by"><img src="'+esc(img(c.photo))+'" alt=""><span><b>'+esc(c.name)+'</b> · '+esc(c.job||'보험설계사')+'<br>'+esc(c.date)+'</span></div>'; }
  function card(c){ var l=lines(c.body).filter(function(x){return x.charAt(0)!=='('&&x.indexOf('##')!==0;}); return '<a class="card" href="/column/p/'+c.id+'.html"><span><span class="tag">'+esc(c.cat||'기타')+'</span> <span class="tag t2">'+esc(c.type||'정보')+'</span></span><h2>'+esc(c.title)+'</h2><p class="ex">'+esc(c.summary||l.join(' '))+'</p>'+by(c)+'</a>'; }
  function list(all){
    var names=[]; all.forEach(function(c){ if(!names.some(function(n){return n.code===c.code;})) names.push({code:c.code,name:c.name}); });
    var cur=a, cat=cq;
    function cnt(k){ return all.filter(function(c){ return (c.cat||'기타')===k && (!cur||c.code===cur); }).length; }
    function draw(){
      var arr=all.filter(function(c){ return (!cur||c.code===cur) && (!cat||(c.cat||'기타')===cat); });
      var total=all.filter(function(c){return !cur||c.code===cur;}).length;
      main.innerHTML='<p class="lbl">관심 분야</p><div class="cats">'+['<button type="button" data-k="" aria-pressed="'+(!cat)+'">전체 <em>'+total+'</em></button>'].concat(CATS.map(function(k){ var n=cnt(k); return '<button type="button" data-k="'+esc(k)+'" aria-pressed="'+(k===cat)+'"'+(n?'':' class="zero"')+'>'+esc(k)+' <em>'+n+'</em></button>'; })).join('')+'</div>'
        +(names.length>1?'<p class="lbl">설계사</p><div class="who">'+[{code:'',name:'전체'}].concat(names).map(function(n){return '<button type="button" data-c="'+esc(n.code)+'" aria-pressed="'+(n.code===cur)+'">'+esc(n.name)+'</button>';}).join('')+'</div>':'')
        +(arr.length?'<div class="list">'+arr.map(card).join('')+'</div>':'<p class="state">이 분야 칼럼은 아직 없습니다. 다른 분야를 골라 보세요.</p>');
    }
    function url(){ var u=[]; if(cat) u.push('c='+encodeURIComponent(cat)); if(cur) u.push('a='+encodeURIComponent(cur)); history.replaceState(null,'',u.length?'?'+u.join('&'):'/column/'); }
    main.addEventListener('click',function(e){
      var k=e.target.closest('.cats button'); if(k){ cat=k.dataset.k; url(); draw(); return; }
      var b=e.target.closest('.who button'); if(b){ cur=b.dataset.c; url(); draw(); }
    });
    draw();
  }
  function detail(c,all){
    document.getElementById('hd').hidden=true;
    document.title=c.title+' | '+c.name+' 설계사 칼럼 · 다온파트너스';
    var md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute('content',lines(c.body).slice(0,2).join(' ').slice(0,150));
    var cn=document.querySelector('link[rel="canonical"]'); if(cn) cn.setAttribute('href','https://daon.io.kr/column/p/'+c.id+'.html');
    var code=encodeURIComponent(c.code);
    var others=all.filter(function(x){return x.code===c.code&&x.id!==c.id;}).slice(0,5);
    main.innerHTML='<article class="art"><a class="back" href="/column/">‹ 칼럼 목록</a> <a class="back" style="margin-left:10px" href="/column/?c='+encodeURIComponent(c.cat||'기타')+'">'+esc(c.cat||'기타')+' 칼럼 더 보기</a><h1>'+esc(c.title)+'</h1>'+by(c)
      +'<div class="body">'+lines(c.body).map(function(x){return '<p'+(x.charAt(0)==='('?' class="note"':'')+'>'+esc(x)+'</p>';}).join('')+'</div>'
      +'<div class="author"><div class="row"><img src="'+esc(img(c.photo))+'" alt="'+esc(c.name)+' 설계사"><div><b>'+esc(c.name)+'</b><br><span style="font-size:14px;color:#3A4048">'+esc(c.job||'보험설계사')+'</span></div></div>'
      +'<div class="act"><a class="a1" href="/expert/?a='+code+'">이 설계사에게 상담받기</a><a class="a2" href="/claim/app/?m='+code+'">보험금 청구 맡기기</a></div></div>'
      +(others.length?'<div class="more"><h3>'+esc(c.name)+' 설계사의 다른 칼럼</h3>'+others.map(function(x){return '<a href="/column/p/'+x.id+'.html">'+esc(x.title)+'</a>';}).join('')+'</div>':'')
      +'</article>';
  }
  fetch(API+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    var all=Array.isArray(d)?d:((d&&d.items)||[]);
    if(id){ var c=all.find(function(x){return x.id===id.replace(/-/g,'');}); if(c) detail(c,all); else main.innerHTML='<p class="state">칼럼을 찾을 수 없습니다. <a href="/column/">칼럼 목록으로</a></p>'; return; }
    list(all);
  }).catch(function(){ main.innerHTML='<p class="state">칼럼을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</p>'; });
})();
</script>
<script>
(function(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});
  var dp=null, btns=[].slice.call(document.querySelectorAll('.js-app')); if(!btns.length) return;
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(standalone){ btns.forEach(function(b){ (b.closest('.appbar')||b).style.display='none'; }); return; }
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); dp=e; });
  btns.forEach(function(btn){ btn.addEventListener('click',function(ev){ ev.preventDefault();
    if(dp){ dp.prompt(); dp.userChoice.finally(function(){ dp=null; }); return; }
    var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    alert(ios?'아이폰: 사파리 아래쪽 [공유] 버튼 → [홈 화면에 추가]를 누르세요.':'브라우저 메뉴(⋮ 또는 ≡) → [홈 화면에 추가] 또는 [앱 설치]를 누르세요.');
  }); });
})();
</script>
</body>
