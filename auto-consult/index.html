<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="index, follow">
<meta name="naver-site-verification" content="a09350fbdee79685108cbb46df68b0bb178bb94b">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">

<meta property="og:description" content="차량번호와 만기일만 알려주시면 여러 보험사 자동차보험 견적을 비교해 드립니다. 상담 비용 없음.">
<meta property="og:url" content="https://daon.io.kr/auto-consult">
<meta name="theme-color" content="#0B1E42">
<link rel="canonical" href="https://daon.io.kr/auto-consult">
<link rel="icon" type="image/png" href="/assets/favicon-daon.png">
<link rel="apple-touch-icon" href="/assets/favicon-daon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/consult.css?v=20261111b">
</head>
<body>
<div class="app">
  <header class="cs-top">
    <a href="/" aria-label="보험물어봄 홈"><img src="/assets/logo-daon-wordmark.png" alt="다온파트너스" width="65" height="22"></a>
    <a class="call" href="tel:0415341124">📞 전화 상담</a>
  </header>

  <section class="cs-hero">
    <div class="ic">🚗</div>
    <p class="kick">자동차보험 견적</p>
    <h1>만기 전에<br>자동차보험 견적 비교</h1>
    <p class="sub">차량번호와 만기일만 알려주세요. 보험사별 보험료를 비교해서 알려드립니다.</p>
    <div class="cs-badges"><span>상담 비용 없음</span><span>신청만으로 가입되지 않음</span></div>
  </section>

  <section class="cs-sec">
    <h2><span class="n">1</span>차량 정보</h2>
    <div class="fl"><label for="cNum">차량번호</label><input class="inp" id="cNum" placeholder="예) 12가 3456" maxlength="12"></div>
    <div class="fl"><label for="cExp">지금 보험 만기일 <small>숫자 8자리</small></label><input class="inp" id="cExp" placeholder="20261231" inputmode="numeric" maxlength="10" data-date></div>
    <div class="fl"><label class="photo"><input type="file" accept="image/*" data-photo="reg"><span class="ph">📷</span><span><b>차량등록증 사진 (선택)</b><small>있으면 견적이 더 빨라요</small></span></label></div>
  </section>
  <section class="cs-sec">
    <h2><span class="n">2</span>원하는 가입 조건</h2>
    <div class="fl"><span class="lb">운전하는 사람</span><div class="seg" data-k="driver"><button type="button" data-v="누구나">누구나</button><button type="button" data-v="가족한정">가족</button><button type="button" data-v="부부한정">부부</button><button type="button" data-v="1인한정">본인만</button><button type="button" data-v="기타">기타</button></div></div>
    <div class="row fl" data-if="driver=부부한정"><div><label for="spName">배우자 이름</label><input class="inp" id="spName" maxlength="20"></div><div><label for="spBirth">배우자 생년월일</label><input class="inp" id="spBirth" inputmode="numeric" maxlength="10" placeholder="19820101" data-date></div></div>
    <div class="fl" data-if="driver=기타"><label for="drvEtc">운전자 범위 직접 적기</label><input class="inp" id="drvEtc" placeholder="예) 본인+자녀(25세)" maxlength="60"></div>
    <div class="fl"><span class="lb">블랙박스</span><div class="seg" data-k="bb"><button type="button" data-v="있음">있어요</button><button type="button" data-v="없음">없어요</button></div></div>
    <div class="fl"><span class="lb">주행거리 할인 특약</span><div class="seg" data-k="mile"><button type="button" data-v="가입 중">하고 있어요</button><button type="button" data-v="미가입">안 해요</button><button type="button" data-v="모름">모름</button></div></div>
    <p class="box-note">정확한 보험료 조회에 필요한 추가 정보는 <b>상담 때 설계사가 직접 확인</b>합니다. 이 화면에서는 주민등록번호를 받지 않습니다.</p>
  </section>
  <div data-contact></div>
  <footer class="cs-legal"></footer>
</div>
<script src="/assets/consult.js?v=20261111b"></script>
<script>
DaonConsult({
  api: 'https://daonpartners.app.n8n.cloud/webhook/daon-auto-lead', contactNo: 3, whoTitle: '계약자(차주) 정보',
  memoHint: '예) 아이가 운전 시작해서 범위를 바꾸고 싶어요',
  doneTips: ['지금 가입한 자동차보험 증권이나 갱신 안내문을 준비해 두시면 빨라집니다.'],
  validate: function(a){
    if (a.v('cNum').length < 4) return ['차량번호를 입력해 주세요', 'cNum'];
    if (a.v('cExp') && !a.validDate(a.v('cExp'), a.nowY - 1, a.nowY + 2)) return ['만기일 8자리를 확인해 주세요 (예: 20261231)', 'cExp'];
    if (!a.S.driver) return ['운전하는 사람 범위를 골라주세요', document.querySelector('[data-k=driver]')];
  },
  payload: function(a){
    return { carNumber: a.v('cNum'), expiryDate: a.v('cExp') || '-', driverScope: a.S.driver,
      spouseName: a.v('spName'), spouseBirth: a.v('spBirth'), driverScopeEtc: a.v('drvEtc'),
      blackbox: a.S.bb || '-', mileage: a.S.mile || '-', job: '-', address: '-',
      regPhotoBase64: a.PHOTOS.reg || '' };
  }
});
</script>
<script src="/assets/home-btn.js" defer></script>
</body>
</html>
