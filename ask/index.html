<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="index, follow">
<meta name="naver-site-verification" content="a09350fbdee79685108cbb46df68b0bb178bb94b">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="보험물어봄 by 다온">
<meta property="og:title" content="보험 상담 신청">
<meta property="og:description" content="건강·자동차·펫·화재보험, 궁금한 보험을 골라 한 번에 상담을 신청하세요. 상담 비용 없음.">
<meta property="og:url" content="https://daon.io.kr/ask">
<meta name="theme-color" content="#0B1E42">
<link rel="canonical" href="https://daon.io.kr/ask">
<link rel="icon" type="image/png" href="/assets/favicon-daon.png">
<link rel="apple-touch-icon" href="/assets/favicon-daon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/consult.css?v=20261111">
</head>
<body>
<div class="app">
  <header class="cs-top">
    <a href="/" aria-label="보험물어봄 홈"><img src="/assets/logo-daon-wordmark.png" alt="다온파트너스" width="65" height="22"></a>
    <a class="call" href="tel:0415341124">📞 전화 상담</a>
  </header>

  <section class="cs-hero">
    <div class="ic">💬</div>
    <p class="kick">보험 상담 신청</p>
    <h1>어떤 보험이<br>궁금하세요?</h1>
    <p class="sub">골라서 신청하시면 다온 보험설계사가 확인하고 연락드립니다.</p>
    <div class="cs-badges"><span>상담 비용 없음</span><span>신청만으로 가입되지 않음</span></div>
  </section>

  <section class="cs-sec">
    <h2><span class="n">1</span>궁금한 보험</h2>
    <div class="fl"><span class="lb">여러 개 골라도 돼요</span><div class="opts multi" data-k="ints"><button type="button" class="opt" data-v="암"><span class="i">🎗️</span><span><b>암</b></span></button><button type="button" class="opt" data-v="뇌·심장"><span class="i">❤️</span><span><b>뇌·심장</b></span></button><button type="button" class="opt" data-v="수술비"><span class="i">🏥</span><span><b>수술비</b></span></button><button type="button" class="opt" data-v="간병인"><span class="i">🤝</span><span><b>간병인</b></span></button><button type="button" class="opt" data-v="치매"><span class="i">🧠</span><span><b>치매</b></span></button><button type="button" class="opt" data-v="실손(실비)"><span class="i">🧾</span><span><b>실손(실비)</b></span></button><button type="button" class="opt" data-v="종합건강"><span class="i">🩺</span><span><b>종합건강</b></span></button><button type="button" class="opt" data-v="어린이·태아"><span class="i">👶</span><span><b>어린이·태아</b></span></button><button type="button" class="opt" data-v="운전자"><span class="i">🚦</span><span><b>운전자</b></span></button><button type="button" class="opt" data-v="종신"><span class="i">🕊️</span><span><b>종신</b></span></button><button type="button" class="opt" data-v="연금"><span class="i">💰</span><span><b>연금</b></span></button><button type="button" class="opt" data-v="자동차"><span class="i">🚗</span><span><b>자동차</b></span></button><button type="button" class="opt" data-v="펫"><span class="i">🐾</span><span><b>펫</b></span></button><button type="button" class="opt" data-v="화재"><span class="i">🔥</span><span><b>주택 화재</b></span></button><button type="button" class="opt" data-v="보험점검"><span class="i">📋</span><span><b>가입한 보험 점검</b></span></button><button type="button" class="opt" data-v="기타"><span class="i">➕</span><span><b>기타</b></span></button></div></div>
    <div class="fl" data-if="ints=자동차"><span class="lb">🚗 자동차보험</span><div class="row"><input class="inp" id="aCar" maxlength="12" placeholder="차량번호"><input class="inp" id="aExp" inputmode="numeric" maxlength="10" placeholder="만기일 20261231" data-date></div></div>
    <div class="fl" data-if="ints=펫"><span class="lb">🐾 펫보험</span><div class="row"><input class="inp" id="aPet" maxlength="30" placeholder="예) 강아지 말티즈"><input class="inp" id="aPetAge" maxlength="10" placeholder="나이 예) 3살"></div></div>
    <div class="fl" data-if="ints=화재"><span class="lb">🔥 화재보험</span><input class="inp" id="aAddr" maxlength="80" placeholder="가입할 집 주소 (동·호수까지)"></div>
  </section>
  <section class="cs-sec">
    <h2><span class="n">2</span>지금 상황</h2>
    <div class="fl"><span class="lb">가입한 보험이 있나요?</span><div class="seg" data-k="has"><button type="button" data-v="있음">있어요</button><button type="button" data-v="없음">없어요</button><button type="button" data-v="모름">잘 몰라요</button></div></div>
  </section>
  <div data-contact></div>
  <footer class="cs-legal"></footer>
</div>
<script src="/assets/consult.js?v=20261111"></script>
<script>
DaonConsult({
  api: 'https://daonpartners.app.n8n.cloud/webhook/daon-health-lead', contactNo: 3,
  validate: function(a){
    if (!a.S.ints.length) return ['궁금한 보험을 하나 이상 골라주세요', document.querySelector('[data-k=ints]')];
  },
  payload: function(a, b){
    var L = [];
    if (a.S.ints.indexOf('자동차') >= 0) L.push('[자동차] 차량번호 ' + (a.v('aCar') || '-') + ' / 만기 ' + (a.v('aExp') || '-'));
    if (a.S.ints.indexOf('펫') >= 0) L.push('[펫] ' + (a.v('aPet') || '-') + ' / ' + (a.v('aPetAge') || '-'));
    if (a.S.ints.indexOf('화재') >= 0) L.push('[화재] 주소 ' + (a.v('aAddr') || '-'));
    if (b.memo) L.push(b.memo);
    return { interests: a.S.ints, interestEtc: '현재 가입 ' + (a.S.has || '-'), memo: L.join(' / '), origin: '통합상담' };
  }
});
</script>
<script src="/assets/home-btn.js" defer></script>
</body>
</html>
